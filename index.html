<html lang="es">

<title>NMS · Refinería</title>

  body::before { content:''; position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse at 20% 30%,#001a2e88 0%,transparent 60%), radial-gradient(ellipse at 80% 70%,#001a1488 0%,transparent 60%); pointer-events:none; }
  .stars { position:fixed; inset:0; z-index:0; pointer-events:none; background-image: radial-gradient(1px 1px at 10% 15%,#ffffff44,transparent), radial-gradient(1px 1px at 25% 45%,#ffffff33,transparent), radial-gradient(1px 1px at 50% 10%,#ffffff55,transparent), radial-gradient(1px 1px at 70% 60%,#ffffff33,transparent), radial-gradient(1px 1px at 85% 25%,#ffffff44,transparent), radial-gradient(1px 1px at 35% 80%,#ffffff22,transparent), radial-gradient(1px 1px at 60% 90%,#ffffff33,transparent); }
  .wrap { position:relative; z-index:1; max-width:920px; margin:0 auto; padding:2rem 1.2rem 4rem; }
  header { text-align:center; margin-bottom:2.5rem; }
  header h1 { font-family:'Orbitron',monospace; font-size:clamp(1.6rem,5vw,2.6rem); font-weight:900; color:var(--gold); letter-spacing:.15em; text-shadow:0 0 30px #f0c04066,0 0 60px #f0c04033; line-height:1.1; }
  header p { font-family:'Share Tech Mono',monospace; color:var(--cyan); font-size:.8rem; letter-spacing:.2em; margin-top:.5rem; opacity:.8; }
  .line-dec { width:60%; height:1px; background:linear-gradient(90deg,transparent,var(--cyan),transparent); margin:1rem auto; box-shadow:var(--glow); }
  .search-wrap { position:relative; margin-bottom:2rem; }
  .search-wrap input { width:100%; padding:1rem 1.4rem 1rem 3.2rem; background:var(--panel); border:1.5px solid var(--border); border-radius:6px; color:var(--white); font-family:'Exo 2',sans-serif; font-size:1.1rem; outline:none; transition:border-color .3s,box-shadow .3s; }
  .search-wrap input:focus { border-color:var(--cyan); box-shadow:var(--glow); }
  .search-wrap input::placeholder { color:var(--grey); }
  .search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--cyan); font-size:1.2rem; pointer-events:none; }
  .clear-btn { position:absolute; right:.8rem; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--grey); font-size:1.2rem; cursor:pointer; display:none; padding:.2rem .4rem; transition:color .2s; }
  .clear-btn:hover { color:var(--red); }
  .autocomplete { position:absolute; top:100%; left:0; right:0; z-index:100; background:var(--panel); border:1px solid var(--border); border-top:none; border-radius:0 0 6px 6px; max-height:240px; overflow-y:auto; display:none; box-shadow:0 8px 32px #000a; }
  .autocomplete.show { display:block; }
  .autocomplete-item { padding:.65rem 1.2rem; cursor:pointer; font-size:.95rem; border-bottom:1px solid var(--border); transition:background .15s; }
  .autocomplete-item:last-child { border-bottom:none; }
  .autocomplete-item:hover,.autocomplete-item.active { background:#0e2a3a; color:var(--cyan); }
  .results-header { font-family:'Share Tech Mono',monospace; font-size:.75rem; color:var(--grey); letter-spacing:.15em; text-transform:uppercase; margin-bottom:1rem; display:none; }
  .results-header span { color:var(--cyan); }
  .recipe-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1.2rem 1.4rem; margin-bottom:1rem; position:relative; overflow:hidden; animation:fadeIn .3s ease; transition:border-color .2s,box-shadow .2s; }
  .recipe-card:hover { border-color:var(--cyan); box-shadow:var(--glow); }
  .recipe-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--cyan),var(--cyan2)); opacity:.6; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .recipe-row { display:flex; align-items:center; flex-wrap:wrap; gap:.5rem; }
  .ingredient { display:flex; flex-direction:column; align-items:center; background:#0d2035; border:1px solid var(--border); border-radius:6px; padding:.5rem .9rem; min-width:100px; }
  .ingredient .iname { font-weight:600; font-size:.88rem; color:var(--white); text-align:center; line-height:1.3; }
  .ingredient .qty { font-family:'Share Tech Mono',monospace; font-size:.75rem; color:var(--gold); margin-top:.15rem; }
  .ingredient.result { background:#0a2010; border-color:#39d35366; }
  .ingredient.result .iname { color:var(--green); }
  .ingredient.result .qty { color:var(--cyan2); }
  .arrow { font-size:1.4rem; color:var(--gold); font-weight:bold; flex-shrink:0; }
  .plus { font-size:1.1rem; color:var(--grey); flex-shrink:0; }
  .refinery-badge { margin-left:auto; font-family:'Share Tech Mono',monospace; font-size:.68rem; padding:.25rem .6rem; border-radius:4px; border:1px solid var(--border); color:var(--grey); white-space:nowrap; flex-shrink:0; }
  .refinery-badge.grande { border-color:#9b59b655; color:#c39bd3; }
  .refinery-badge.media  { border-color:#f0c04055; color:var(--gold); }
  .refinery-badge.todas  { border-color:#00d4ff33; color:var(--cyan); }
  .no-results { text-align:center; padding:3rem 1rem; color:var(--grey); font-family:'Share Tech Mono',monospace; font-size:.9rem; }
  .no-results .icon { font-size:2.5rem; margin-bottom:.8rem; display:block; }
  .hint { text-align:center; padding:4rem 1rem; color:var(--grey); font-family:'Share Tech Mono',monospace; font-size:.85rem; letter-spacing:.08em; line-height:2.2; }
  .hint .big { font-size:3rem; display:block; margin-bottom:1rem; }
  .hint em { color:var(--cyan); font-style:normal; }
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

// ÍNDICE
// ═══════════════════════════════════════════════════════════
const allNames=new Set();
R.forEach(r=>{allNames.add(r.r);allNames.add(r.i1);if(r.i2)allNames.add(r.i2);if(r.i3)allNames.add(r.i3);});
const RESOURCES=[...allNames].sort((a,b)=>a.localeCompare(b,'es'));

// DOM
const searchEl=document.getElementById('search');
const clearBtn=document.getElementById('clearBtn');
const autoEl=document.getElementById('autocomplete');
const resultsEl=document.getElementById('results');
const hdrEl=document.getElementById('resultsHeader');
let acIdx=-1;
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function sugg(q){return !q?[]:RESOURCES.filter(r=>norm(r).includes(norm(q))).slice(0,12);}

function renderAC(list){
  if(!list.length){autoEl.classList.remove('show');return;}
  autoEl.innerHTML=list.map(s=>`<div class="autocomplete-item" data-v="${s}">${s}</div>`).join('');
  autoEl.classList.add('show');acIdx=-1;
}

function refCls(r){if(!r||r==="Todas")return"todas";if(r.includes("Grande"))return"grande";return"media";}

function chip(name,qty,isRes=false){
  return`<div class="ingredient${isRes?' result':''}"><span class="iname">${name}</span><span class="qty">×${qty}</span></div>`;
}

function doSearch(query){
  if(!query){resultsEl.innerHTML='';hdrEl.style.display='none';showHint();return;}
  const nq=norm(query);
  const found=R.filter(r=>norm(r.r).includes(nq));
  hdrEl.style.display='block';
  if(!found.length){
    hdrEl.innerHTML=`Sin resultados para <span>"${query}"</span>`;
    resultsEl.innerHTML=`<div class="no-results"><span class="icon">⬡</span>No hay recetas para obtener "<strong>${query}</strong>".<br>Verifica la ortografía o prueba con un nombre parcial.</div>`;
    return;
  }
  hdrEl.innerHTML=`<span>${found.length}</span> receta${found.length>1?'s':''} para obtener <span>"${found[0].r}"</span>`;
  resultsEl.innerHTML=found.map(r=>{
    const i2=r.i2?`<span class="plus">+</span>${chip(r.i2,r.q2)}`:'';
    const i3=r.i3?`<span class="plus">+</span>${chip(r.i3,r.q3)}`:'';
    return`<div class="recipe-card"><div class="recipe-row">${chip(r.i1,r.q1)}${i2}${i3}<span class="arrow">→</span>${chip(r.r,r.qr,true)}<span class="refinery-badge ${refCls(r.ref)}">${r.ref||'Todas'}</span></div></div>`;
  }).join('');
}

function showHint(){
  resultsEl.innerHTML=`<div class="hint"><span class="big">⬡</span>Escribe el nombre de cualquier recurso<br>para ver <em>todas las formas de obtenerlo</em><br>en la refinería.<br><br><em>Ej: Ferrita imantada · Metal cromático · Nanitos · Cloro · Nitrato de sodio</em></div>`;
}
showHint();

searchEl.addEventListener('input',()=>{
  const q=searchEl.value.trim();
  clearBtn.style.display=q?'block':'none';
  renderAC(sugg(q));
  if(!q){showHint();hdrEl.style.display='none';return;}
  doSearch(q);
});
searchEl.addEventListener('keydown',e=>{
  const items=autoEl.querySelectorAll('.autocomplete-item');
  if(e.key==='ArrowDown'){acIdx=Math.min(acIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('active',i===acIdx));}
  else if(e.key==='ArrowUp'){acIdx=Math.max(acIdx-1,-1);items.forEach((el,i)=>el.classList.toggle('active',i===acIdx));}
  else if(e.key==='Enter'&&acIdx>=0&&items[acIdx]){const v=items[acIdx].dataset.v;searchEl.value=v;autoEl.classList.remove('show');doSearch(v);clearBtn.style.display='block';}
  else if(e.key==='Escape'){autoEl.classList.remove('show');}
});
autoEl.addEventListener('click',e=>{
  const item=e.target.closest('.autocomplete-item');
  if(!item)return;
  searchEl.value=item.dataset.v;autoEl.classList.remove('show');doSearch(item.dataset.v);clearBtn.style.display='block';
});
clearBtn.addEventListener('click',()=>{searchEl.value='';clearBtn.style.display='none';autoEl.classList.remove('show');showHint();hdrEl.style.display='none';searchEl.focus();});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))autoEl.classList.remove('show');});
</script>
